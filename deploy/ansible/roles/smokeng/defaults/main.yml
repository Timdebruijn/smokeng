---
# Which release to install. Pin it: an unattended "latest" turns every play
# into an unreviewed upgrade.
smokeng_version: v0.14.3
smokeng_repo: Timdebruijn/smokeng

smokeng_user: smokeng
smokeng_group: smokeng
smokeng_bin: /usr/local/bin/smokeng
smokeng_state_dir: /var/lib/smokeng
smokeng_db: "{{ smokeng_state_dir }}/smokeng.db"

# Loopback by default. Binding anywhere else without authentication needs
# smokeng_allow_unauthenticated, which is spelled out on purpose.
smokeng_listen: 127.0.0.1:8080
# The address others reach this master at, when that is not where it listens —
# a TLS-terminating proxy in front, most often. The enrolment command the UI
# shows has to name an address agents can reach, not the one whoever opened the
# page happened to use. Also becomes the default OIDC redirect base.
smokeng_external_url: ""
# CIDRs whose X-Forwarded-For may be believed, e.g. "10.0.0.0/8". Log lines
# only: nothing is authorised on a client address, so this makes the logs name
# the real client behind a proxy and changes nothing else.
smokeng_trusted_proxies: ""
smokeng_allow_unauthenticated: false

# Prometheus cannot present a session cookie, so /metrics needs this to be
# scrapable at all.
smokeng_metrics_public: false

# Alertmanager-compatible endpoint. Empty means rules are stored but never
# evaluated.
smokeng_alert_webhook: ""

# OIDC. Setting the issuer enables authentication; the rest is only read then.
smokeng_oidc_issuer: ""
smokeng_oidc_client_id: ""
smokeng_oidc_client_secret: ""
smokeng_oidc_redirect_url: ""
smokeng_oidc_admin_claim: groups
smokeng_oidc_admin_value: ""

# Comma-separated PEM files on the target host whose certificates https probes
# trust, on top of the system roots — an internal PKI, most often. This keeps
# verification on, which a target's tls_skip_verify turns off; prefer this.
#
# Remote agents receive these with their assignments, so this file is the only
# place a private root has to be placed and a rotation reaches every agent
# within a poll.
smokeng_tls_ca_files: ""

# Shared HMAC secrets for irtt servers that require one, so only this prober may
# use them — closing the reflection/amplification and spoofing an open UDP
# server invites. A map of "host:port" (the target's configured host, as
# written in the tree) to the secret. Put the values in a vault, never here in
# the clear:
#
#   smokeng_irtt_hmac_keys:
#     "resolver.gemeentex.nl:2112": "{{ vault_irtt_gemeentex }}"
#     "10.30.0.5:2112": "{{ vault_irtt_other }}"
#
# The secrets live only in the keyfile this renders on the host; they never
# enter the target tree, the API or an export. Each prober host that measures an
# HMAC-required endpoint needs the relevant entries — the master does not hand
# these down, because they are secrets and assignments carry only data.
smokeng_irtt_hmac_keys: {}
smokeng_irtt_hmac_keyfile: "{{ smokeng_state_dir }}/irtt-hmac-keys.toml"

# Run the prober as its own process next to the master, instead of inside it.
#
# Off by default: one process is the right shape for one host, and this trades
# a shared database handle for a signed HTTP round trip plus a second unit to
# operate. Turn it on when you want to restart the UI without interrupting
# measurement, upgrade the two separately, or keep the ICMP permission on the
# half that needs it. See docs/operations.md.
#
# Enabling it does not move anything by itself: the master keeps its built-in
# "local" prober, and a target measures here only once its `agents` setting
# names smokeng_prober_agent_name.
smokeng_prober_enabled: false
smokeng_prober_agent_name: local-probe
# Where the prober reaches the master. Always loopback: the prober is on the
# same host, so nothing has to leave it, and plain http is accepted for exactly
# that reason.
#
# Only the port is taken from smokeng_listen. Reusing the whole value breaks
# the moment the master binds a wildcard — "0.0.0.0:8080" is where to listen,
# not somewhere to connect, and the agent rightly refuses it as neither HTTPS
# nor loopback.
smokeng_prober_master_url: "http://127.0.0.1:{{ smokeng_listen.split(':') | last }}"
smokeng_prober_key: "{{ smokeng_state_dir }}/prober.key"
smokeng_prober_db: "{{ smokeng_state_dir }}/prober.db"

# Optional path on the controller to a targets.toml to import after install.
smokeng_targets_file: ""
smokeng_targets_prune: false

# Restrict unprivileged ICMP to the service's own group rather than opening it
# to every user on the box. Override with a literal "low high" pair if you have
# a reason to widen it.
smokeng_ping_group_range: ""
