---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart smokeng
  ansible.builtin.systemd_service:
    name: smokeng
    state: restarted

- name: Restart smokeng prober
  ansible.builtin.systemd_service:
    name: smokeng-prober
    state: restarted
  # Only when the prober is actually installed: another task (the HMAC keyfile)
  # may notify this handler on a host that runs the master alone, and asking
  # systemd to restart a unit that was never written would fail. A check run
  # never wrote the unit either, so it is excluded for the same reason.
  when: smokeng_prober_enabled | bool and not ansible_check_mode
