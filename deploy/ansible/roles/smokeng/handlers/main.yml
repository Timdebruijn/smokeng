---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart smokeng
  ansible.builtin.systemd_service:
    name: smokeng
    state: restarted
  # An agent host has no smokeng.service; the binary and sysctl tasks notify
  # this handler on every host.
  when: smokeng_mode == 'master'

# Two handlers on one topic, run in this order. The binary and sysctl tasks
# notify on the first install too, and the first flush comes before the prober
# unit is written, so whether it exists has to be looked up when the handler
# runs, not assumed: restarting a unit systemd has never seen fails. The unit
# task notifies again once it has written the file. A check run of a first
# install finds no file either, and skips the restart for the same reason.
- name: Look for the prober unit
  ansible.builtin.stat:
    path: /etc/systemd/system/smokeng-prober.service
  register: _smokeng_prober_unit
  listen: Restart smokeng prober

# Only while the prober is wanted: a unit left behind by an earlier run with the
# prober on is stopped, and restarting it would start it again.
- name: Restart the prober
  ansible.builtin.systemd_service:
    name: smokeng-prober
    state: restarted
  when: _smokeng_prober | bool and _smokeng_prober_unit.stat.exists
  listen: Restart smokeng prober
