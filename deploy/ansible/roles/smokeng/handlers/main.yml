---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart smokeng
  ansible.builtin.systemd_service:
    name: smokeng
    state: restarted

- name: Restart smokeng prober
  ansible.builtin.systemd_service:
    name: smokeng-prober
    state: restarted
  # A check run never wrote the unit, so systemd cannot be asked to restart it.
  # Reporting that as a failure would describe the check, not the host.
  when: not ansible_check_mode
