# One group per instance, each a child of smokeng.
#
# The play targets `smokeng`, so a child group is matched by it — and
# group_vars/<child>.yml then applies to that instance alone.
#
# Putting hosts directly in `smokeng` works while there is exactly one of them.
# From the second onwards — in this file or in another inventory, it makes no
# difference — group_vars/smokeng.yml reaches every host in the group: one
# instance's listen address, its authentication settings and its target tree
# are silently inherited by the rest. That has happened here, where a laptop's
# "0.0.0.0:8080, no authentication, my own targets" arrived at a public host.
[home]
smokeng.example.lan ansible_host=192.0.2.10 ansible_user=debian

[home:vars]
ansible_python_interpreter=/usr/bin/python3

# A second instance goes in its own group with its own group_vars file:
#
#   [office]
#   smokeng-office ansible_host=192.0.2.20 ansible_user=debian
#
#   [office:vars]
#   ansible_python_interpreter=/usr/bin/python3

[smokeng:children]
home
# office
