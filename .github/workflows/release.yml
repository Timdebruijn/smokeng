name: Release

# Two jobs, and the split is the point. `build` runs everything that executes
# this repository's code and the code of its dependencies (the tests, the Node
# toolchain, the Go build) with a token that can only read. `publish` holds the
# permissions that can write a release and mint an attestation, and runs nothing
# from the repository: it takes what `build` produced, checks it against the
# checksums, attests it, and uploads it. A compromised dependency in the build
# can therefore change what is released, but it cannot do so with a token that
# can publish, and the attestation says which workflow run built each file.
#
# Every action is pinned to a commit (see ci.yml).

on:
  push:
    tags: ['v*']
  # A dry run of `build` from any branch: the same tests, the same binaries, the
  # same checksum check, and nothing published (publish only runs for a tag).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Binaries are stamped with `git describe`, which needs the tags.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Refuse to ship a binary whose tests were never run: a tag is not a
      # reason to skip the checks, it is a reason to insist on them.
      - name: allow unprivileged ICMP sockets
        run: sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"
      - run: go test ./...
      - run: npm test # needs no node_modules: Node strips the types and the tests import none
        working-directory: web

      - name: build release binaries
        run: make dist

      # What publish will check again after the artifact has travelled.
      - name: the checksums describe what was built
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    # Only a tag publishes. A manual run stops after build.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its files
      id-token: write # a short-lived Sigstore certificate for the attestation
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist
          # A file that does not match what was uploaded fails the run (the
          # default in this version, written out so it stays so).
          digest-mismatch: error

      # The checksum list is the one thing the attestation and the release both
      # rest on, so what travelled has to match it before either happens.
      - name: the files are the ones that were built
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS

      # Signed build provenance for every file in SHA256SUMS: which workflow, on
      # which commit, built it. Verify with `gh attestation verify FILE --repo
      # Timdebruijn/smokeng`.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # In the environment, not in the script: a tag name is chosen by whoever
          # pushes it, and inside `run:` it would be part of the shell command.
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$REPO" \
            --title "smokeng $TAG" \
            --generate-notes \
            --verify-tag \
            dist/smokeng-* dist/LICENSE dist/THIRD-PARTY-NOTICES dist/SHA256SUMS
