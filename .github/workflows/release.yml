name: Release

# Two jobs. `build` runs everything that executes this repository's code and the
# code of its dependencies (the tests, the Node toolchain, the Go build) with a
# token that can only read. `publish` holds the permissions that can write a
# release and mint an attestation, and runs nothing from the repository: it takes
# what `build` produced, attests it, and uploads it.
#
# What that buys, and what it does not. The build never holds a token that can
# publish, so a dependency that is compromised while it builds cannot upload or
# delete anything by itself. It can still change what the binaries contain, and
# they will be attested all the same: the attestation says which workflow run, on
# which commit, built a file, not that the source was sound. The checksum checks
# in both jobs catch corruption in transit, not a tampered build: SHA256SUMS comes
# from the same artifact as the files.
#
# Neither job uses a cache: a tag run could otherwise restore one written by a
# job on main, one more input to the binaries that nothing attests.
#
# Every action is pinned to a commit (see ci.yml).

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags: ['v*']
  # A dry run of `build` from any branch: the same tests, the same binaries, the
  # same checksum check, and nothing published (publish only runs for a tag).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Binaries are stamped with `git describe`, which needs the tags.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Refuse to ship a binary whose tests were never run: a tag is not a
      # reason to skip the checks, it is a reason to insist on them.
      - name: allow unprivileged ICMP sockets
        run: sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"
      - run: go test ./...
      - run: npm test # needs no node_modules: Node strips the types and the tests import none
        working-directory: web

      - name: build release binaries
        run: make dist

      # What publish will check again after the artifact has travelled.
      - name: the checksums describe what was built
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
          # So that re-running the whole workflow after a failed publish does not
          # trip over the artifact the first attempt left behind.
          overwrite: true

  publish:
    needs: build
    # Only the push of a tag publishes. A manual run, even one started on a tag,
    # stops after build.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release and upload its files
      id-token: write # a short-lived Sigstore certificate for the attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist
          # A file that does not match what was uploaded fails the run (the
          # default in this version, written out so it stays so).
          digest-mismatch: error

      # The checksum list is what the attestation and the release both name, so
      # what travelled has to match it before either happens (this catches
      # corruption in transit; see the top of the file for what it cannot).
      - name: the files are the ones that were built
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS

      # Signed build provenance for every file in SHA256SUMS: which workflow, on
      # which commit, built it. Verify with `gh attestation verify FILE --repo
      # Timdebruijn/smokeng`.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # In the environment, not in the script: a tag name is chosen by whoever
          # pushes it, and inside `run:` it would be part of the shell command.
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$REPO" \
            --title "smokeng $TAG" \
            --generate-notes \
            --verify-tag \
            dist/smokeng-* dist/LICENSE dist/THIRD-PARTY-NOTICES dist/SHA256SUMS
