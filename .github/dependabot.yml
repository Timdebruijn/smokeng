# Version updates. Security updates are a separate repository setting.
#
# A week's cooldown on every ecosystem: a release that is hours old has had no
# time to be found malicious or broken, and the cost of waiting is a week.
# Security updates ignore it.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]

  # The frontend ships react and two font packages in the bundle; vite and
  # typescript build it. Both groups are reviewed like any other change, and
  # web/dist is checked against the source by CI, so a bump that changes the
  # output has to commit the new output.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The frontend tests run on Node 22 (ci.yml), so their types stay on that
      # line; a newer major would typecheck them against APIs Node 22 lacks. Raise
      # the Node version and this together.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  # The workflows pin every action to a commit; this keeps the pins moving.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
